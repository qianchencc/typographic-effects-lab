name: Restore original Wave Memory PNG

on:
  push:
    branches: [main]
    paths:
      - 'assets/outputs/chunks/**'
      - 'scripts/restore_full_outputs.py'
      - '.github/workflows/restore-wave-memory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact original image and verify SHA256
        run: python scripts/restore_full_outputs.py
      - name: Commit reconstructed PNG if absent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/outputs/04-wave-memory.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: restore original Wave Memory PNG from verified chunks"
            git push
          fi
